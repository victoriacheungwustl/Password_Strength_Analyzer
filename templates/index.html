<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Strength Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fadeIn { animation: fadeIn 0.7s ease-out; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-gray-900 via-gray-800 to-pink-900 text-gray-100 flex flex-col items-center justify-center py-20">

    <div id="main-card" class="w-full max-w-md bg-gray-800/80 rounded-2xl p-8 border border-pink-700/40 text-center shadow-[0_20px_50px_-10px_rgba(236,72,153,0.5)]">
    <h1 class="text-3xl font-bold mb-4 text-pink-400">Password Strength Analyzer</h1>

    <form id="password-form" class="space-y-4">
      <div class="relative">
        <input id="password" type="password" placeholder="Enter your password" class="w-full px-4 py-2 rounded-lg bg-gray-700 text-gray-100 focus:outline-none focus:ring-2 focus:ring-pink-500" />
        <button id="toggle-password" type="button" class="absolute right-3 top-2.5 text-gray-400 hover:text-pink-400">
          <i class="fa-solid fa-eye"></i>
        </button>
      </div>
      <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 shadow-lg shadow-pink-500/30">
        Analyze
      </button>
    </form>

    <div class="mt-6 w-full bg-gray-700 rounded-full h-3">
      <div id="fill" class="h-3 rounded-full bg-gray-500 transition-all duration-500 w-0"></div>
    </div>

    <div id="result" class="mt-3 text-lg font-semibold"></div>
    <div id="feedback" class="mt-2 text-sm text-left"></div>

    <p class="text-xs text-gray-400 mt-6">
      Built with 💖 by Victoria Cheung & Annabel Lee for CSE4333
    </p>
  </div>

  <div id="chart-card" class="hidden w-full max-w-md bg-gray-800/80 rounded-2xl p-6 border border-pink-700/40 text-center mt-8 animate-fadeIn mb-10 shadow-[0_20px_50px_-10px_rgba(236,72,153,0.4)]">
    <canvas id="strengthAspectChart" width="400" height="300"></canvas>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
